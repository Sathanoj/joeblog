<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
var searchData = [
  {{- range $index, $page := .Site.RegularPages }}
  {{- if $index }},{{ end }}
  {
    title: "{{ $page.Title | safeJS }}",
    date: "{{ $page.Date.Format "2006-01-02" }}",
    permalink: "{{ $page.Permalink | safeJS }}",
    tags: [{{- range $i, $tag := $page.Params.tags }}{{ if $i }},{{ end }}"{{ $tag | safeJS }}"{{ end -}}],
    categories: [{{- range $i, $cat := $page.Params.categories }}{{ if $i }},{{ end }}"{{ $cat | safeJS }}"{{ end -}}],
    content: "{{ $page.Content | plainify | safeJS }}"
  }{{- end }}
];

var fuse = new Fuse(searchData, {
  keys: ['title', 'content', 'tags'],
  threshold: 0.4,
  includeScore: true
});

document.addEventListener('DOMContentLoaded', function () {
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');

  if (!searchInput) return;

  searchInput.addEventListener('input', function () {
    var query = searchInput.value.trim();
    if (!query) {
      searchResults.innerHTML = '';
      return;
    }

    var results = fuse.search(query);
    var html = '';
    for (var i = 0; i < Math.min(results.length, 10); i++) {
      var item = results[i].item;
      html += '<div class="search-result-item">';
      html += '<a href="' + item.permalink + '"><strong>' + item.title + '</strong></a>';
      if (item.tags && item.tags.length) {
        html += ' <span class="search-result-tags">';
        for (var j = 0; j < item.tags.length; j++) {
          html += '#' + item.tags[j] + ' ';
        }
        html += '</span>';
      }
      html += '</div>';
    }
    searchResults.innerHTML = html;
  });
});
</script>
