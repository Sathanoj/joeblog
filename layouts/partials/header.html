<header class="site-header">
  <div class="container">
    <a class="logo" href="{{ "/" | relURL }}">
      <span class="logo__main">{{ .Site.Title }}</span>
    </a>
    <button class="dark-toggle" id="darkToggle" aria-label="Alternar modo escuro" type="button">
      <svg class="dark-toggle__light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><g stroke-dasharray="3 2"><line x1="6" y1="5" x2="18" y2="5"/><line x1="6" y1="8" x2="18" y2="8"/></g></svg>
      <svg class="dark-toggle__dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="7" cy="7" r="2" fill="currentColor"/></svg>
    </button>
    <div class="nav-shell">
      <input class="nav__check visually-hidden" type="checkbox" id="siteNavToggle" aria-controls="siteNav" aria-expanded="false">
      <label class="nav__toggle" for="siteNavToggle">
        <span class="visually-hidden">{{ i18n "openMenu" }}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </label>
      <nav class="nav" id="siteNav" aria-label="{{ i18n "primaryNavigation" }}">
        {{ range .Site.Menus.main }}
        <a class="nav__link" href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </div>
</header>
